<div class="cart-side-item border-bottom py-2" data-cart-row="{{ dish.pk }}">
    <div class="d-flex justify-content-between gap-2">
        <strong class="small">{{ dish.name }}</strong>
        <form method="post" action="{% url 'remove_from_cart' dish.pk %}" class="cart-remove-form">
            {% csrf_token %}
            <button type="submit" class="btn btn-sm btn-link text-danger p-0" title="Прибрати">&times;</button>
        </form>
    </div>
    <div class="d-flex justify-content-between align-items-center mt-1">
        <form method="post" action="{% url 'update_cart' dish.pk %}" class="cart-quantity-form d-flex align-items-center gap-1">
            {% csrf_token %}
            <input name="quantity" type="number" min="1" max="10" value="{{ dish.quantity }}"
                class="form-control form-control-sm cart-quantity-input" aria-label="Кількість">
        </form>
        <span class="small cart-item-subtotal">₴{{ dish.subtotal }}</span>
    </div>
</div>
