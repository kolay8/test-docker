{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
    <h2>{{ title }}</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Зберегти</button>
        {% if dish %}
            <a href="{% url 'detail' dish.pk %}">Скасувати</a>
        {% else %}
            <a href="{% url 'menu' %}">Скасувати</a>
        {% endif %}
    </form>
{% endblock %}
